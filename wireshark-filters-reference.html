<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireshark Filters Reference — BL</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
    --border: #30363d; --text: #e6edf3; --muted: #8b949e;
    --blue: #58a6ff; --green: #3fb950; --amber: #d29922; --red: #f85149;
    --cyan: #39d3f2; --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; min-height: 100vh; }
  header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 18px 24px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 10; }
  .logo { width: 38px; height: 38px; background: #1565c0; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  h1 { font-size: 18px; font-weight: 600; }
  .tagline { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .badge-brand { margin-left: auto; font-size: 11px; color: var(--cyan); background: rgba(57,211,242,0.1); border: 1px solid rgba(57,211,242,0.25); padding: 3px 10px; border-radius: 20px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .controls { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: 0.5; }
  input[type=text] { width: 100%; background: var(--bg2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px 8px 34px; border-radius: 6px; font-size: 13px; }
  input[type=text]:focus { outline: none; border-color: var(--blue); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab { padding: 5px 13px; border-radius: 20px; border: 1px solid var(--border); font-size: 12px; cursor: pointer; background: transparent; color: var(--muted); transition: all 0.15s; }
  .tab:hover { color: var(--text); border-color: #8b949e; }
  .tab.active { background: rgba(88,166,255,0.1); border-color: rgba(88,166,255,0.4); color: var(--blue); }
  .col-header { display: grid; grid-template-columns: 2fr 100px 1.5fr; gap: 12px; padding: 6px 12px; margin-bottom: 6px; }
  .col-h { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 3px; }
  .row { display: grid; grid-template-columns: 2fr 100px 1.5fr; gap: 12px; align-items: start; padding: 9px 12px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; transition: all 0.12s; }
  .row:hover { background: var(--bg2); border-color: var(--border); }
  .row:active { background: rgba(57,211,242,0.05); }
  .fcode { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 12.5px; color: var(--cyan); word-break: break-all; }
  .fdesc { font-size: 12.5px; color: var(--muted); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; }
  .badge-c { background: rgba(63,185,80,0.15); color: var(--green); border: 1px solid rgba(63,185,80,0.3); }
  .badge-d { background: rgba(88,166,255,0.12); color: var(--blue); border: 1px solid rgba(88,166,255,0.3); }
  .badge-b { background: rgba(210,153,34,0.15); color: var(--amber); border: 1px solid rgba(210,153,34,0.3); }
  .count { color: var(--muted); font-size: 12px; margin-top: 14px; text-align: right; }
  .copy-toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg3); border: 1px solid var(--border); color: var(--green); padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 99; }
  .copy-toast.show { opacity: 1; }
  .no-results { text-align: center; padding: 40px; color: var(--muted); }
  section.group { margin-bottom: 28px; }
  .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 8px; padding-left: 2px; }
  footer { text-align: center; padding: 24px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); margin-top: 32px; }
</style>
</head>
<body>

<header>
  <div class="logo">🦈</div>
  <div>
    <h1>Wireshark Filters Reference</h1>
    <div class="tagline">Capture &amp; Display filters — click any row to copy</div>
  </div>
  <div class="badge-brand">BL Security+</div>
</header>

<main>
  <div class="controls">
    <div class="search-wrap">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="Search filters, protocols, descriptions…" oninput="filterRows()">
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" onclick="setTab('all',this)">All</button>
    <button class="tab" onclick="setTab('ip',this)">IP / Host</button>
    <button class="tab" onclick="setTab('port',this)">Ports</button>
    <button class="tab" onclick="setTab('proto',this)">Protocols</button>
    <button class="tab" onclick="setTab('http',this)">HTTP/Web</button>
    <button class="tab" onclick="setTab('dns',this)">DNS</button>
    <button class="tab" onclick="setTab('tls',this)">TLS/SSL</button>
    <button class="tab" onclick="setTab('ops',this)">Operators</button>
    <button class="tab" onclick="setTab('flags',this)">TCP Flags</button>
    <button class="tab" onclick="setTab('arp',this)">ARP/ICMP</button>
    <button class="tab" onclick="setTab('adv',this)">Advanced</button>
  </div>

  <div class="col-header">
    <div class="col-h">Filter / Syntax</div>
    <div class="col-h">Type</div>
    <div class="col-h">Description</div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="count" id="count"></div>
</main>

<footer>BL Cybersecurity Reference · blaborte.github.io · Wireshark Filters Cheat Sheet</footer>
<div class="copy-toast" id="toast">✓ Copied to clipboard</div>

<script>
const FILTERS = [
  {f:"ip.addr == 192.168.1.1", type:"d", desc:"Match any packet with this IP (src or dst)", tags:"ip host"},
  {f:"ip.src == 192.168.1.1", type:"d", desc:"Match packets from this source IP", tags:"ip host"},
  {f:"ip.dst == 192.168.1.1", type:"d", desc:"Match packets to this destination IP", tags:"ip host"},
  {f:"ip.addr == 192.168.1.0/24", type:"d", desc:"Match entire subnet (CIDR notation)", tags:"ip host"},
  {f:"ip.ttl < 10", type:"d", desc:"Packets with low TTL (traceroute/scan detection)", tags:"ip"},
  {f:"ip.proto == 6", type:"d", desc:"Filter by IP protocol number (6=TCP)", tags:"ip proto"},
  {f:"ip.flags.df == 1", type:"d", desc:"Don't Fragment bit set", tags:"ip"},
  {f:"!ip.addr == 192.168.1.1", type:"d", desc:"Exclude a specific IP address", tags:"ip host"},
  {f:"ip.src == 10.0.0.0/8 && ip.dst == 172.16.0.0/12", type:"d", desc:"Traffic between two subnets", tags:"ip host"},
  {f:"host 192.168.1.1", type:"c", desc:"Capture traffic to/from this host", tags:"ip host"},
  {f:"net 192.168.1.0/24", type:"c", desc:"Capture traffic to/from subnet", tags:"ip host"},
  {f:"src host 192.168.1.1", type:"c", desc:"Capture from specific source host", tags:"ip host"},
  {f:"dst host 192.168.1.1", type:"c", desc:"Capture to specific destination host", tags:"ip host"},
  {f:"not host 192.168.1.1", type:"c", desc:"Exclude host from capture", tags:"ip host"},
  {f:"tcp.port == 80", type:"d", desc:"Any TCP traffic on port 80", tags:"port tcp"},
  {f:"tcp.srcport == 443", type:"d", desc:"TCP traffic from source port 443", tags:"port tcp tls"},
  {f:"tcp.dstport == 22", type:"d", desc:"TCP traffic destined for port 22 (SSH)", tags:"port tcp"},
  {f:"udp.port == 53", type:"d", desc:"UDP traffic on port 53 (DNS)", tags:"port udp dns"},
  {f:"udp.dstport == 67", type:"d", desc:"DHCP requests (UDP port 67)", tags:"port udp proto"},
  {f:"tcp.port >= 1024", type:"d", desc:"All ephemeral/high port TCP traffic", tags:"port tcp"},
  {f:"tcp.port in {80 443 8080 8443}", type:"d", desc:"Match any of these ports (set syntax)", tags:"port tcp http"},
  {f:"port 80", type:"c", desc:"Capture port 80 traffic", tags:"port"},
  {f:"port 443", type:"c", desc:"Capture HTTPS traffic", tags:"port tls"},
  {f:"portrange 1-1024", type:"c", desc:"Capture well-known port range", tags:"port"},
  {f:"not port 22", type:"c", desc:"Exclude SSH from capture", tags:"port"},
  {f:"tcp", type:"b", desc:"All TCP traffic", tags:"proto tcp"},
  {f:"udp", type:"b", desc:"All UDP traffic", tags:"proto udp"},
  {f:"icmp", type:"b", desc:"All ICMP traffic", tags:"proto arp icmp"},
  {f:"arp", type:"b", desc:"All ARP traffic", tags:"proto arp"},
  {f:"icmpv6", type:"d", desc:"ICMPv6 (IPv6 neighbor discovery etc.)", tags:"proto arp icmp"},
  {f:"ospf", type:"d", desc:"OSPF routing protocol traffic", tags:"proto"},
  {f:"bgp", type:"d", desc:"BGP routing traffic (port 179)", tags:"proto"},
  {f:"smtp", type:"d", desc:"SMTP email traffic", tags:"proto"},
  {f:"ftp", type:"d", desc:"FTP control channel traffic", tags:"proto"},
  {f:"ssh", type:"d", desc:"SSH traffic", tags:"proto"},
  {f:"dhcp", type:"d", desc:"DHCP request/response packets", tags:"proto"},
  {f:"ntp", type:"d", desc:"Network Time Protocol traffic", tags:"proto"},
  {f:"snmp", type:"d", desc:"SNMP management traffic", tags:"proto"},
  {f:"rdp", type:"d", desc:"Remote Desktop Protocol", tags:"proto"},
  {f:"http", type:"d", desc:"All HTTP traffic", tags:"http proto"},
  {f:"http.request", type:"d", desc:"HTTP requests only", tags:"http"},
  {f:"http.response", type:"d", desc:"HTTP responses only", tags:"http"},
  {f:'http.request.method == "GET"', type:"d", desc:"HTTP GET requests", tags:"http"},
  {f:'http.request.method == "POST"', type:"d", desc:"HTTP POST requests", tags:"http"},
  {f:"http.response.code == 200", type:"d", desc:"HTTP 200 OK responses", tags:"http"},
  {f:"http.response.code == 404", type:"d", desc:"HTTP 404 Not Found", tags:"http"},
  {f:"http.response.code >= 400", type:"d", desc:"All HTTP error responses", tags:"http"},
  {f:'http.host contains "example.com"', type:"d", desc:"HTTP traffic to a specific host", tags:"http"},
  {f:'http.request.uri contains "/login"', type:"d", desc:"HTTP requests to login path", tags:"http"},
  {f:"http.cookie", type:"d", desc:"HTTP traffic containing cookies", tags:"http"},
  {f:'http.content_type contains "json"', type:"d", desc:"HTTP JSON content type", tags:"http"},
  {f:"dns", type:"d", desc:"All DNS traffic", tags:"dns proto"},
  {f:'dns.qry.name == "example.com"', type:"d", desc:"DNS query for specific domain", tags:"dns"},
  {f:'dns.qry.name contains "google"', type:"d", desc:"DNS queries containing keyword", tags:"dns"},
  {f:"dns.flags.response == 1", type:"d", desc:"DNS response packets only", tags:"dns"},
  {f:"dns.flags.response == 0", type:"d", desc:"DNS query packets only", tags:"dns"},
  {f:"dns.resp.type == 1", type:"d", desc:"DNS A record responses", tags:"dns"},
  {f:"dns.resp.type == 28", type:"d", desc:"DNS AAAA (IPv6) responses", tags:"dns"},
  {f:"dns.resp.type == 5", type:"d", desc:"DNS CNAME responses", tags:"dns"},
  {f:"dns.resp.type == 15", type:"d", desc:"DNS MX record responses", tags:"dns"},
  {f:"dns.count.answers == 0", type:"d", desc:"DNS queries with no answer (NXDOMAIN etc.)", tags:"dns"},
  {f:"tls", type:"d", desc:"All TLS/SSL traffic", tags:"tls proto"},
  {f:"tls.handshake", type:"d", desc:"TLS handshake packets", tags:"tls"},
  {f:"tls.handshake.type == 1", type:"d", desc:"TLS Client Hello messages", tags:"tls"},
  {f:"tls.handshake.type == 2", type:"d", desc:"TLS Server Hello messages", tags:"tls"},
  {f:"tls.record.version == 0x0303", type:"d", desc:"TLS 1.2 traffic", tags:"tls"},
  {f:"tls.record.version == 0x0304", type:"d", desc:"TLS 1.3 traffic", tags:"tls"},
  {f:'tls.handshake.extensions_server_name contains "example.com"', type:"d", desc:"TLS SNI matching a domain", tags:"tls"},
  {f:"ssl.alert_message", type:"d", desc:"TLS alert messages (errors/warnings)", tags:"tls"},
  {f:"&&", type:"b", desc:"Logical AND — both conditions must be true", tags:"ops"},
  {f:"||", type:"b", desc:"Logical OR — either condition true", tags:"ops"},
  {f:"!", type:"b", desc:"Logical NOT — negate a condition", tags:"ops"},
  {f:"and / or / not", type:"c", desc:"BPF equivalents for capture filters", tags:"ops"},
  {f:"contains", type:"d", desc:"Substring match in field value", tags:"ops"},
  {f:"matches / ~", type:"d", desc:"Perl-compatible regex match", tags:"ops"},
  {f:"== != < > <= >=", type:"b", desc:"Comparison operators", tags:"ops"},
  {f:"in {val1 val2 val3}", type:"d", desc:"Match against a set of values", tags:"ops"},
  {f:"[n:m]", type:"d", desc:"Slice operator — bytes n through m", tags:"ops adv"},
  {f:"tcp.flags.syn == 1", type:"d", desc:"TCP SYN flag set (connection start)", tags:"flags tcp"},
  {f:"tcp.flags.ack == 1", type:"d", desc:"TCP ACK flag set", tags:"flags tcp"},
  {f:"tcp.flags.fin == 1", type:"d", desc:"TCP FIN flag set (graceful close)", tags:"flags tcp"},
  {f:"tcp.flags.rst == 1", type:"d", desc:"TCP RST — connection reset", tags:"flags tcp"},
  {f:"tcp.flags.push == 1", type:"d", desc:"TCP PSH flag — push data immediately", tags:"flags tcp"},
  {f:"tcp.flags.urg == 1", type:"d", desc:"TCP URG urgent pointer set", tags:"flags tcp"},
  {f:"tcp.flags == 0x002", type:"d", desc:"Only SYN set (new connection attempt)", tags:"flags tcp"},
  {f:"tcp.flags == 0x012", type:"d", desc:"SYN-ACK (server response to SYN)", tags:"flags tcp"},
  {f:"tcp.flags == 0x004", type:"d", desc:"RST only — abrupt connection reset", tags:"flags tcp"},
  {f:"tcp.flags.syn==1 && tcp.flags.ack==0", type:"d", desc:"Pure SYN — port scan detection", tags:"flags tcp"},
  {f:"arp.opcode == 1", type:"d", desc:"ARP requests (who has?)", tags:"arp icmp"},
  {f:"arp.opcode == 2", type:"d", desc:"ARP replies (tell...)", tags:"arp icmp"},
  {f:"arp.src.hw_mac == ff:ff:ff:ff:ff:ff", type:"d", desc:"Gratuitous ARP (possible spoofing)", tags:"arp icmp"},
  {f:"icmp.type == 8", type:"d", desc:"ICMP Echo Request (ping)", tags:"arp icmp"},
  {f:"icmp.type == 0", type:"d", desc:"ICMP Echo Reply", tags:"arp icmp"},
  {f:"icmp.type == 3", type:"d", desc:"ICMP Destination Unreachable", tags:"arp icmp"},
  {f:"icmp.type == 11", type:"d", desc:"ICMP Time Exceeded (TTL expired)", tags:"arp icmp"},
  {f:"frame.len > 1000", type:"d", desc:"Packets larger than 1000 bytes", tags:"adv"},
  {f:"frame.time_delta > 1", type:"d", desc:"Frames with over 1s gap since previous", tags:"adv"},
  {f:"tcp.analysis.retransmission", type:"d", desc:"TCP retransmissions", tags:"adv tcp"},
  {f:"tcp.analysis.duplicate_ack", type:"d", desc:"Duplicate ACKs (possible congestion)", tags:"adv tcp flags"},
  {f:"tcp.analysis.zero_window", type:"d", desc:"TCP zero window (receiver buffer full)", tags:"adv tcp"},
  {f:"tcp.analysis.out_of_order", type:"d", desc:"Out-of-order TCP segments", tags:"adv tcp"},
  {f:"tcp.len > 0", type:"d", desc:"TCP segments with payload data", tags:"adv tcp"},
  {f:'data-text-lines contains "password"', type:"d", desc:"Search raw text for keyword", tags:"adv"},
  {f:'frame contains "USER"', type:"d", desc:"Frame bytes contain string", tags:"adv"},
  {f:"eth.addr == aa:bb:cc:dd:ee:ff", type:"d", desc:"Filter by MAC address", tags:"adv"},
  {f:"vlan.id == 100", type:"d", desc:"Filter VLAN tagged traffic", tags:"adv"},
  {f:"wlan.addr == aa:bb:cc:dd:ee:ff", type:"d", desc:"Filter by Wi-Fi MAC address", tags:"adv"},
];

let activeTab='all';

function badge(t){
  if(t==='c') return '<span class="badge badge-c">Capture</span>';
  if(t==='d') return '<span class="badge badge-d">Display</span>';
  return '<span class="badge badge-b">Both</span>';
}

function renderGrid(data){
  const g=document.getElementById('grid');
  const c=document.getElementById('count');
  g.innerHTML='';
  if(!data.length){g.innerHTML='<div class="no-results">No filters match your search.</div>';c.textContent='';return;}
  data.forEach(r=>{
    const row=document.createElement('div');
    row.className='row';
    row.innerHTML=`<div class="fcode">${r.f.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div><div>${badge(r.type)}</div><div class="fdesc">${r.desc}</div>`;
    row.addEventListener('click',()=>{
      navigator.clipboard.writeText(r.f).catch(()=>{});
      const t=document.getElementById('toast');
      t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'),1800);
    });
    g.appendChild(row);
  });
  c.textContent=`Showing ${data.length} of ${FILTERS.length} filters`;
}

function getFiltered(){
  const q=document.getElementById('search').value.toLowerCase();
  return FILTERS.filter(r=>{
    const mt=activeTab==='all'||r.tags.includes(activeTab);
    const mq=!q||r.f.toLowerCase().includes(q)||r.desc.toLowerCase().includes(q)||r.tags.toLowerCase().includes(q);
    return mt&&mq;
  });
}

function filterRows(){renderGrid(getFiltered());}
function setTab(t,el){
  activeTab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  filterRows();
}

renderGrid(FILTERS);
</script>
</body>
</html>
